<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" width="1100" height="770" role="img" aria-label="NIDS build-time and run-time system topology">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>
  <g font-family="Liberation Sans, DejaVu Sans, sans-serif" fill="#0f172a">

    <!-- BUILD -->
    <rect x="20" y="20" width="1060" height="360" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
    <text x="44" y="56" font-size="12" font-weight="700" fill="#4f46e5" letter-spacing="2">BUILD TIME</text>
    <text x="44" y="78" font-size="12.5" fill="#64748b">raw capture → cleaned table → trained artifact</text>
    <text x="1056" y="56" font-size="10.5" fill="#94a3b8" text-anchor="end">offline · repeatable · pinned versions</text>

    <!-- build nodes -->
    <g>
      <rect x="44" y="98" width="232" height="238" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
      <circle cx="72" cy="134" r="17" fill="#eef2ff"/>
      <g transform="translate(58,120)" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 24h7a4.6 4.6 0 0 0 0-9.2 7 7 0 0 0-13-2.4A5 5 0 0 0 15 24z"/>
      </g>
      <text x="98" y="131" font-size="14.5" font-weight="700">CSE-CIC-IDS2018</text>
      <text x="98" y="149" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.2">SOURCE + INGEST</text>
      <line x1="58" y1="167" x2="262" y2="167" stroke="#eef2f7"/>
      <g font-size="11.8" fill="#334155">
        <circle cx="62" cy="190" r="2.2" fill="#94a3b8"/><text x="73" y="194">10 day CSVs · ~6.4 GB</text>
        <circle cx="62" cy="216" r="2.2" fill="#94a3b8"/><text x="73" y="220">79 predictors + Label</text>
        <circle cx="62" cy="242" r="2.2" fill="#94a3b8"/><text x="73" y="246">15 classes, verbatim names</text>
        <circle cx="62" cy="268" r="2.2" fill="#94a3b8"/><text x="73" y="272">download.sh: resume + retry</text>
      </g>
      <rect x="58" y="292" width="204" height="30" rx="7" fill="#f1f5f9"/>
      <text x="68" y="311" font-size="10.2" fill="#475569">public S3 bucket · no credentials</text>
    </g>

    <g>
      <rect x="304" y="98" width="232" height="238" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
      <circle cx="332" cy="134" r="17" fill="#e0f2fe"/>
      <g transform="translate(320,122)" fill="none" stroke="#0891b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 3h16l-7 8v9l-4 3v-12z"/>
      </g>
      <text x="358" y="131" font-size="14.5" font-weight="700">clean.py</text>
      <text x="358" y="149" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.2">PREPARE</text>
      <line x1="318" y1="167" x2="522" y2="167" stroke="#eef2f7"/>
      <g font-size="11.8" fill="#334155">
        <circle cx="322" cy="190" r="2.2" fill="#94a3b8"/><text x="333" y="194">200,000-row chunks</text>
        <circle cx="322" cy="216" r="2.2" fill="#94a3b8"/><text x="333" y="220">drop repeated headers</text>
        <circle cx="322" cy="242" r="2.2" fill="#94a3b8"/><text x="333" y="246">inf → NaN; drop bad rows</text>
        <circle cx="322" cy="268" r="2.2" fill="#94a3b8"/><text x="333" y="272">drop IP / port / timestamp</text>
        <circle cx="322" cy="294" r="2.2" fill="#94a3b8"/><text x="333" y="298">Benign cap 150k / day</text>
      </g>
      <rect x="318" y="308" width="204" height="20" rx="6" fill="#ecfeff"/>
      <text x="328" y="322" font-size="9.8" fill="#155e75">→ clean.joblib · 4.25M × 78</text>
    </g>

    <g>
      <rect x="564" y="98" width="232" height="238" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.8"/>
      <circle cx="592" cy="134" r="17" fill="#eef2ff"/>
      <g transform="translate(580,122)" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="5" width="14" height="14" rx="3"/>
        <path d="M11 11h3v3h-3zM19 9h3M19 15h3M9 19v3M15 19v3M2 9h3M2 15h3"/>
      </g>
      <text x="618" y="131" font-size="14.5" font-weight="700">train.py</text>
      <text x="618" y="149" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.2">LEARN</text>
      <line x1="578" y1="167" x2="782" y2="167" stroke="#eef2f7"/>
      <rect x="578" y="178" width="204" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="586" y="194" font-size="10.3" fill="#475569">Random Forest · baseline</text>
      <rect x="578" y="208" width="204" height="24" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="586" y="224" font-size="10.3" fill="#3730a3" font-weight="700">MLP 128–64 · selected</text>
      <g font-size="11.8" fill="#334155">
        <circle cx="582" cy="252" r="2.2" fill="#94a3b8"/><text x="593" y="256">80 / 20 stratified split</text>
        <circle cx="582" cy="278" r="2.2" fill="#94a3b8"/><text x="593" y="282">select by macro F1</text>
        <circle cx="582" cy="304" r="2.2" fill="#94a3b8"/><text x="593" y="308">→ model.joblib · 0.2 MB</text>
      </g>
    </g>

    <g>
      <rect x="824" y="98" width="232" height="238" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
      <circle cx="852" cy="134" r="17" fill="#ecfdf5"/>
      <g transform="translate(838,121)" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="24" height="16" rx="2.5"/>
        <path d="M10 24h8M14 20v4M6 9l3 2 5-3"/>
      </g>
      <text x="878" y="131" font-size="14.5" font-weight="700">main.py</text>
      <text x="878" y="149" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.2">SERVE</text>
      <line x1="838" y1="167" x2="1042" y2="167" stroke="#eef2f7"/>
      <g font-size="11.8" fill="#334155">
        <circle cx="842" cy="190" r="2.2" fill="#94a3b8"/><text x="853" y="194">Streamlit · port 8501</text>
        <circle cx="842" cy="216" r="2.2" fill="#94a3b8"/><text x="853" y="220">loads + caches model once</text>
        <circle cx="842" cy="242" r="2.2" fill="#94a3b8"/><text x="853" y="246">same cleaning as train</text>
        <circle cx="842" cy="268" r="2.2" fill="#94a3b8"/><text x="853" y="272">CSV in → threat report</text>
      </g>
      <rect x="838" y="292" width="204" height="30" rx="7" fill="#ecfdf5"/>
      <text x="848" y="311" font-size="10.2" fill="#065f46">stateless · no DB · no training</text>
    </g>

    <g stroke="#94a3b8" stroke-width="1.5" fill="none">
      <line x1="280" y1="217" x2="296" y2="217" marker-end="url(#arr)"/>
      <line x1="540" y1="217" x2="556" y2="217" marker-end="url(#arr)"/>
      <line x1="800" y1="217" x2="816" y2="217" marker-end="url(#arr)"/>
    </g>
    <text x="44" y="368" font-size="10" fill="#94a3b8" font-family="Liberation Mono, DejaVu Sans Mono, monospace">6.4 GB raw  →  4,246,934 × 78  →  3,397,547 train / 849,387 test  →  0.2 MB artifact</text>

    <!-- RUN -->
    <rect x="20" y="400" width="1060" height="350" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
    <text x="44" y="436" font-size="12" font-weight="700" fill="#0891b2" letter-spacing="2">RUN TIME</text>
    <text x="44" y="458" font-size="12.5" fill="#64748b">one process · one host · stateless inference</text>
    <text x="1056" y="436" font-size="10.5" fill="#94a3b8" text-anchor="end">untrusted input · no outbound calls at scoring time</text>

    <g>
      <rect x="44" y="478" width="232" height="222" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
      <circle cx="72" cy="514" r="17" fill="#eef2ff"/>
      <g transform="translate(59,502)" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="3" width="24" height="19" rx="3"/><path d="M1 9h24M5 6h.01M9 6h.01"/>
      </g>
      <text x="98" y="511" font-size="14.5" font-weight="700">Analyst browser</text>
      <text x="98" y="529" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.2">CLIENT</text>
      <line x1="58" y1="547" x2="262" y2="547" stroke="#eef2f7"/>
      <g font-size="11.8" fill="#334155">
        <circle cx="62" cy="572" r="2.2" fill="#94a3b8"/><text x="73" y="576">uploads a raw day CSV</text>
        <circle cx="62" cy="600" r="2.2" fill="#94a3b8"/><text x="73" y="604">reads threat counts</text>
        <circle cx="62" cy="628" r="2.2" fill="#94a3b8"/><text x="73" y="632">inspects 200 flows</text>
        <circle cx="62" cy="656" r="2.2" fill="#94a3b8"/><text x="73" y="660">downloads report CSV</text>
      </g>
      <text x="62" y="686" font-size="9.8" fill="#94a3b8">untrusted boundary</text>
    </g>

    <g>
      <rect x="304" y="478" width="232" height="222" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.8"/>
      <circle cx="332" cy="514" r="17" fill="#eef2ff"/>
      <g transform="translate(318,502)" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="24" height="17" rx="3"/><path d="M9 10l4 3-4 3M16 16h5"/>
      </g>
      <text x="358" y="511" font-size="14.5" font-weight="700">Streamlit process</text>
      <text x="358" y="529" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.2">MAIN.PY · :8501</text>
      <line x1="318" y1="547" x2="522" y2="547" stroke="#eef2f7"/>
      <g font-size="11.8" fill="#334155">
        <circle cx="322" cy="572" r="2.2" fill="#94a3b8"/><text x="333" y="576">strips + coerces columns</text>
        <circle cx="322" cy="600" r="2.2" fill="#94a3b8"/><text x="333" y="604">inf → NaN; drops rows</text>
        <circle cx="322" cy="628" r="2.2" fill="#94a3b8"/><text x="333" y="632">predicts the whole file</text>
        <circle cx="322" cy="656" r="2.2" fill="#94a3b8"/><text x="333" y="660">Styler, no HTML injection</text>
      </g>
      <text x="322" y="686" font-size="9.8" fill="#4f46e5">one predict() call per upload</text>
    </g>

    <g>
      <rect x="564" y="478" width="232" height="222" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
      <circle cx="592" cy="514" r="17" fill="#e0f2fe"/>
      <g transform="translate(579,502)" fill="none" stroke="#0891b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="13" cy="6" rx="10" ry="4"/><path d="M3 6v15c0 2.2 4.5 4 10 4s10-1.8 10-4V6M3 13.5c0 2.2 4.5 4 10 4s10-1.8 10-4"/>
      </g>
      <text x="618" y="511" font-size="14.5" font-weight="700">Model artifacts</text>
      <text x="618" y="529" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.2">MODELS/ · READ-ONLY</text>
      <line x1="578" y1="547" x2="782" y2="547" stroke="#eef2f7"/>
      <g font-size="11.8" fill="#334155">
        <circle cx="582" cy="572" r="2.2" fill="#94a3b8"/><text x="593" y="576">model.joblib · 0.2 MB</text>
        <circle cx="582" cy="600" r="2.2" fill="#94a3b8"/><text x="593" y="604">features + classes + encoder</text>
        <circle cx="582" cy="628" r="2.2" fill="#94a3b8"/><text x="593" y="632">metrics.json + matrix CSV</text>
        <circle cx="582" cy="656" r="2.2" fill="#94a3b8"/><text x="593" y="660">cached per session</text>
      </g>
      <text x="582" y="686" font-size="9.8" fill="#0e7490">committed → clone and run</text>
    </g>

    <g>
      <rect x="824" y="478" width="232" height="222" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
      <circle cx="852" cy="514" r="17" fill="#ecfdf5"/>
      <g transform="translate(840,502)" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2h10l5 5v20H6z"/><path d="M16 2v6h5M10 13h8M10 18h8M10 23h5"/>
      </g>
      <text x="878" y="511" font-size="14.5" font-weight="700">Threat report</text>
      <text x="878" y="529" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.2">IN MEMORY</text>
      <line x1="838" y1="547" x2="1042" y2="547" stroke="#eef2f7"/>
      <g font-size="11.8" fill="#334155">
        <circle cx="842" cy="572" r="2.2" fill="#94a3b8"/><text x="853" y="576">flows · malicious · benign</text>
        <circle cx="842" cy="600" r="2.2" fill="#94a3b8"/><text x="853" y="604">attack-type breakdown</text>
        <circle cx="842" cy="628" r="2.2" fill="#94a3b8"/><text x="853" y="632">suspicious rows + truth</text>
        <circle cx="842" cy="656" r="2.2" fill="#94a3b8"/><text x="853" y="660">full CSV built on demand</text>
      </g>
      <text x="842" y="686" font-size="9.8" fill="#047857">no report persisted server-side</text>
    </g>

    <g stroke="#94a3b8" stroke-width="1.5" fill="none">
      <line x1="280" y1="588" x2="296" y2="588" marker-end="url(#arr)"/>
      <line x1="540" y1="588" x2="556" y2="588" marker-end="url(#arr)"/>
      <line x1="800" y1="588" x2="816" y2="588" marker-end="url(#arr)"/>
    </g>

    <path d="M940 704 L940 730 L160 730 L160 706" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrI)"/>
    <text x="550" y="724" font-size="9.8" fill="#6366f1" text-anchor="middle" font-weight="700" letter-spacing="0.8">REPORT + FULL CSV DOWNLOAD</text>
  </g>
</svg>
